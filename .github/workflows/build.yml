name: Android CI & APK Build

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compile & Upload APK Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Required Android SDK Platform (API 36)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Prepare .env and debug.keystore
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Rename APK for Release Artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ESP32-Smart-Hub-Nightly-1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-Smart-Hub-Nightly-1.0.0-APK
          path: |
            app/build/outputs/apk/debug/ESP32-Smart-Hub-Nightly-1.0.0.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
